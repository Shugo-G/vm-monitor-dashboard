{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Monitoreo de VMs</title>
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}" id="theme-light">
    <link rel="stylesheet" href="{% static 'css/dashboard_dt.css' %}" id="theme-dark" disabled>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🖥️ ShugoVision Monitoreo de VMs</h1>
            <div class="header-info">
                <span id="vm-count">Cargando...</span>
                <span id="last-update">Última actualización: --</span>
            </div>
        </header>

        <div class="controls">
            <button class="btn btn-primary" onclick="refreshData()">🔄 Actualizar</button>
            
            <button class="btn btn-primary" onclick="collapseAll()" title="Contraer todas las tarjetas">
                📁 Contraer Todas
            </button>
            
            <button class="btn btn-primary" onclick="expandAll()" title="Expandir todas las tarjetas">
                📂 Expandir Todas
            </button>
            
            <button class="btn btn-small" id="theme-toggle" onclick="toggleTheme()">
                🌙 Cambiar a Oscuro
            </button>
            
            <label class="toggle-all">
                <input type="checkbox" id="show-hidden" onchange="toggleShowHidden()">
                <span>Mostrar VMs ocultas</span>
            </label>
        </div>

        <div id="vm-grid" class="vm-grid">
            <div class="loading">
                <div class="spinner"></div>
                <p>Cargando información de las VMs...</p>
            </div>
        </div>
    </div>

    <script src="{% static 'js/dashboard.js' %}"></script>
    <script src="{% static 'js/theme_manager.js' %}"></script>
</body>
</html>
