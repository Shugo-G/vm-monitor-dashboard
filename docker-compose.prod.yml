# Overrides de producción (Nginx Proxy Manager)
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  backend:
    networks:
      - shugovision-net
      - npm-net

  frontend:
    ports: !reset []   # NPM maneja el tráfico, no exponemos al host
    networks:
      - shugovision-net
      - npm-net

networks:
  shugovision-net:
    driver: bridge
  npm-net:
    external: true
    name: nginx-proxy-manager_npm-net
