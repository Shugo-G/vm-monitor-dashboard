services:
  backend:
    container_name: monitor-backend
    build:
      context: .
      dockerfile: backend.Dockerfile
      network: host
    env_file: .env
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - DJANGO_CSRF_TRUSTED_ORIGINS=${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      - DB_PATH=${DB_PATH:-/app/data/db.sqlite3}
      - TZ=${TZ:-America/Argentina/Ushuaia}
    volumes:
      - static_volume:/app/static_root
      - data_volume:/app/data
    restart: always
    networks:
      - shugovision-net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/vms/')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    container_name: monitor-frontend
    build:
      context: .
      dockerfile: frontend.Dockerfile
    environment:
      - TZ=${TZ:-America/Argentina/Ushuaia}
    volumes:
      - static_volume:/app/static_root:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - shugovision-net

volumes:
  static_volume:
  data_volume:

networks:
  shugovision-net:
    driver: bridge
